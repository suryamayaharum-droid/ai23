<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b0b0b"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<title>HARUM Browser Fabric</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b0b0b;color:#eee8dc}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b0b0b,#171717)}
main{max-width:980px;margin:auto;padding:24px}
h1{font-family:Georgia,serif;font-weight:600;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid #3a3428;background:#141414;padding:16px;border-radius:12px}
small,.muted{color:#aaa49a}.ok{color:#d5b66f}.bad{color:#d88}
button{background:#b58a3a;color:#0b0b0b;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:#0d0d0d;padding:12px;border-radius:8px;max-height:320px;overflow:auto}
input,textarea{width:100%;box-sizing:border-box;background:#101010;color:#eee8dc;border:1px solid #444;padding:10px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>HARUM Browser Fabric</h1>
<p class="muted">Célula autoprovisionável: navegador → worker → memória local → Python/WASM → IA WebGPU.</p>
<div class="grid">
  <section class="card"><b>Nó</b><pre id="node">iniciando…</pre></section>
  <section class="card"><b>Capacidades</b><pre id="caps">detectando…</pre></section>
  <section class="card"><b>Malha local</b><pre id="mesh">aguardando…</pre></section>
</div>
<section class="card" style="margin-top:12px">
  <b>Executar tarefa local</b>
  <textarea id="task" rows="4">Conte quantos arquivos existem no índice local e responda em JSON.</textarea>
  <p><button id="run">Executar</button> <button id="python">Testar Python</button> <button id="ai">Carregar IA WebGPU</button></p>
  <pre id="out"></pre>
</section>
<script type="module" src="./src/app.js"></script>
</main>
</body>
</html>
