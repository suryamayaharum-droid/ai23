name: Repository Adapter Plane v25.2 Public Proof
on:
  pull_request:
    branches: [harum-repository-organism-v25-proof]
    paths:
      - "tools/harum-repository-organism-v25-proof/repository_adapters.py"
      - "tools/harum-repository-organism-v25-proof/repository_adapters.json"
      - "tools/harum-repository-organism-v25-proof/test_adapters.py"
      - ".github/workflows/harum-repository-adapters-v25-2-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate explicit adapter boundaries
        working-directory: tools/harum-repository-organism-v25-proof
        run: python -m unittest test_adapters -v
