name: HARUM Organism Pulse

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harum-organism-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout HARUM organism DNA
        uses: actions/checkout@v4
        with:
          ref: harum-archive

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore organism memory
        uses: actions/cache@v4
        with:
          path: runtime
          key: harum-organism-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            harum-organism-${{ runner.os }}-

      - name: Validate organism DNA
        run: |
          python -m json.tool ecosystem/swarm/config/agents.json >/dev/null
          python -m json.tool ecosystem/swarm/config/workflows.json >/dev/null
          python -m json.tool ecosystem/swarm/config/missions.json >/dev/null
          python -m json.tool ecosystem/swarm/config/plugin_fabric.json >/dev/null
          python -m json.tool ecosystem/swarm/config/synapses.json >/dev/null
          python -m json.tool ecosystem/swarm/config/city_v8_airtable_snapshot.json >/dev/null
          python -m py_compile ecosystem/swarm/*.py

      - name: Organism pulse
        run: |
          python ecosystem/swarm/organism_cycle.py             --db runtime/harum_organism.db             --output runtime/organism-pulse.json

      - name: Swarm regression tests
        run: python -m unittest discover -s ecosystem/swarm/tests -v

      - name: Preserve pulse telemetry
        uses: actions/upload-artifact@v4
        with:
          name: harum-organism-pulse-${{ github.run_id }}
          path: |
            runtime/organism-pulse.json
            runtime/harum_organism.db
          retention-days: 7
          if-no-files-found: error
