name: HARUM Organism Pulse v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harum-organism-pulse.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harum-organism-pulse-v5
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.HARUM_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.HARUM_SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout HARUM organism DNA
        uses: actions/checkout@v4
        with:
          ref: harum-archive
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore organism memory
        uses: actions/cache@v4
        with:
          path: runtime
          key: harum-organism-v5-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            harum-organism-v5-${{ runner.os }}-
            harum-organism-v4-${{ runner.os }}-
            harum-organism-v3-${{ runner.os }}-

      - name: Validate organism and cortex DNA
        run: |
          for f in ecosystem/swarm/config/*.json ecosystem/cortex/config/*.json; do
            python -m json.tool "$f" >/dev/null
          done
          python -m py_compile ecosystem/swarm/*.py
          python -m py_compile ecosystem/cortex/*.py

      - name: Execute organism cycle v5
        run: |
          python ecosystem/swarm/organism_cycle_v5.py             --db runtime/harum_organism.db             --output runtime/organism-v5.json

      - name: Swarm regression tests
        run: python -m unittest discover -s ecosystem/swarm/tests -v

      - name: Cortex deterministic tests
        run: python -m unittest discover -s ecosystem/cortex/tests -v

      - name: Persist compact organism state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecosystem/runtime
          cp runtime/organism-v5.json ecosystem/runtime/organism-v5-latest.json
          cp runtime/digital-twin-v2.json ecosystem/runtime/digital-twin-v2-latest.json
          cp runtime/cortex-status.json ecosystem/runtime/cortex-status-latest.json
          if [ -f runtime/journal/snapshot.json ]; then
            cp runtime/journal/snapshot.json ecosystem/runtime/journal-snapshot-latest.json
          fi
          git config user.name 'harum-organism-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ecosystem/runtime/
          if git diff --cached --quiet; then
            echo 'No persistent state changes.'
            exit 0
          fi
          git commit -m 'Update HARUM organism v5 cognitive state'
          git push origin HEAD:harum-archive

      - name: Preserve short-lived telemetry
        uses: actions/upload-artifact@v4
        with:
          name: harum-organism-v5-${{ github.run_id }}
          path: |
            runtime/organism-v5.json
            runtime/digital-twin-v2.json
            runtime/cortex-status.json
            runtime/journal/
          retention-days: 2
          if-no-files-found: error
