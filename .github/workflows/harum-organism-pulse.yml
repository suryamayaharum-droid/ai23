name: HARUM Organism Pulse v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harum-organism-pulse.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harum-organism-pulse-v6
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.HARUM_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.HARUM_SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout HARUM organism DNA
        uses: actions/checkout@v4
        with:
          ref: harum-archive
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore organism memory
        uses: actions/cache@v4
        with:
          path: runtime
          key: harum-organism-v6-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            harum-organism-v6-${{ runner.os }}-
            harum-organism-v5-${{ runner.os }}-
            harum-organism-v4-${{ runner.os }}-

      - name: Validate organism, cortex and browser DNA
        run: |
          for f in ecosystem/swarm/config/*.json ecosystem/cortex/config/*.json ecosystem/browser-fabric/config/*.json; do
            python -m json.tool "$f" >/dev/null
          done
          python -m py_compile ecosystem/swarm/*.py
          python -m py_compile ecosystem/cortex/*.py
          for f in ecosystem/browser-fabric/src/*.js ecosystem/browser-fabric/sw.js; do
            node --check "$f"
          done

      - name: Execute organism cycle v6
        run: |
          python ecosystem/swarm/organism_cycle_v6.py             --db runtime/harum_organism.db             --output runtime/organism-v6.json

      - name: Swarm regression tests
        run: python -m unittest discover -s ecosystem/swarm/tests -v

      - name: Cortex deterministic tests
        run: python -m unittest discover -s ecosystem/cortex/tests -v

      - name: Persist compact organism state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecosystem/runtime
          cp runtime/organism-v6.json ecosystem/runtime/organism-v6-latest.json
          cp runtime/digital-twin-v3.json ecosystem/runtime/digital-twin-v3-latest.json
          cp runtime/browser-fabric-status.json ecosystem/runtime/browser-fabric-status-latest.json
          if [ -f runtime/journal/snapshot.json ]; then
            cp runtime/journal/snapshot.json ecosystem/runtime/journal-snapshot-latest.json
          fi
          git config user.name 'harum-organism-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ecosystem/runtime/
          if git diff --cached --quiet; then
            echo 'No persistent state changes.'
            exit 0
          fi
          git commit -m 'Update HARUM organism v6 browser state'
          git push origin HEAD:harum-archive

      - name: Preserve short-lived telemetry
        uses: actions/upload-artifact@v4
        with:
          name: harum-organism-v6-${{ github.run_id }}
          path: |
            runtime/organism-v6.json
            runtime/digital-twin-v3.json
            runtime/browser-fabric-status.json
            runtime/journal/
          retention-days: 2
          if-no-files-found: error
