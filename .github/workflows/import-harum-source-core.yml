name: Import HARUM source core

on:
  push:
    branches:
      - harum-archive
    paths:
      - '.github/workflows/import-harum-source-core.yml'

permissions:
  contents: write

jobs:
  import-source-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          ref: harum-archive
          fetch-depth: 0

      - name: Download and unpack source core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecosystem/programs/core
          curl -fL --retry 3 'https://at.adobe.com/Cprei8GJyQyv9vhi' -o /tmp/harum-source-core.zip
          unzip -q -o /tmp/harum-source-core.zip -d ecosystem/programs/core

      - name: Commit source core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'harum-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ecosystem/programs/core
          if git diff --cached --quiet; then
            echo 'No new program files to commit.'
            exit 0
          fi
          git commit -m 'Import HARUM program source core'
          git push origin HEAD:harum-archive
