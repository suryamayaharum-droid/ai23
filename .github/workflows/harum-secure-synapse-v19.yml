name: Harum Secure Synapse v19

on:
  pull_request:
    paths:
      - 'tools/harum-cinematic-grid/v18/**'
      - 'tools/harum-cinematic-grid/v19/**'
      - '.github/workflows/harum-secure-synapse-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-synapse-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Compile
        run: python -m compileall -q tools/harum-cinematic-grid/v18 tools/harum-cinematic-grid/v19
      - name: Execute encrypted end-to-end proof
        run: python tools/harum-cinematic-grid/v19/proof_v19.py
      - name: Verify proof gates
        run: |
          python - <<'PY'
          import json
          p='tools/harum-cinematic-grid/v19/PROOF.json'
          x=json.load(open(p))
          assert x['first_execution']['ok']
          assert x['restart_replay']['replayed']
          assert x['restart_replay']['same_signed_receipt']
          assert x['aead_tamper_rejected']
          assert x['wrong_server_identity_rejected']
          assert x['cas_integrity']
          assert x['first_execution']['attestation_chain']['valid']
          print('HARUM Secure Synapse v19 proof: PASS')
          PY
