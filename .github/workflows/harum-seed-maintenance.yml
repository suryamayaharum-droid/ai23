name: Harum Seed Maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify substrate-independent seed
        run: |
          python -m py_compile tools/harum-cinematic-grid/v13/harum_seed.py
          cd tools/harum-cinematic-grid/v13
          python harum_seed.py bootstrap
          python harum_seed.py export /tmp/harum-seed.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/harum-seed.json'))
          assert x['version']=='harum.seed.snapshot.v1'
          print('seed ok')
          PY
